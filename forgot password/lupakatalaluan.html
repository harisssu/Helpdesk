<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>E-ICT Aduan</title>
    <style>
        body {
            font-family:Arial, Helvetica, sans-serif;
            margin: 0;
            height: 100vh;
            background-image: url("img/it6.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container{
            width: 400px;
            background: rgb(240, 237, 237);
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(154, 76, 76, 0.1);
        }

        .title {
            text-align: center;
            font-size: 2.2rem;
            font-weight: bold;
            color: black;
            margin-bottom: 1rem;
        }

        label {
            width: 120px;
            margin-right: 10px;
            font-weight: 500;
            color: #000000;
        }

        input {
            flex: 1;
            padding: 0.2rem;
            border: 0.8px solid #1d0e0e;
            font-size: 0.9rem;
        }

        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .btn {
            width: 50%;
            background: #081c4b;
            border-radius: 0px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            display: block;
            margin-top: 1rem;
            border: 0.8px solid #1d0e0e;
            font-size: 0.8rem;
            padding: 8px;
        }

        .button-group {
            display: flex;
            gap: 40px;
        }

        .msg {
            margin-top: 12px;
            color: #000;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

  <div class="container">
    <div class="title">Lupa Kata Laluan</div>

    <form id="forgotForm">
      <div class="form-group">
        <label for="emel">Emel: </label>
        <input type="email" id="emel" name="email" required />
      </div>

      <div class="button-group">
        <a href="login.html" class="btn" style="text-align:center; text-decoration:none; line-height:2;">
          Kembali
        </a>
        <button type="submit" id="btnHantar" class="btn">Hantar</button>
      </div>

      <div class="msg" id="msg"></div>
    </form>
  </div>

  <script>
  const btn = document.getElementById('btnHantar');
  const msg = document.getElementById('msg');

  btn.addEventListener('click', async () => {
    const emel = document.getElementById('emel').value.trim();
    msg.textContent = '';

    if (!emel) {
      msg.textContent = 'Sila isi emel.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Hantar';

    try {
  const formData = new FormData();
  formData.append('email', emel);

  const res = await fetch('request_reset.php', {
    method: 'POST',
    body: formData
  });

  const text = await res.text(); // ambil text dulu
  console.log('STATUS:', res.status);
  console.log('RESPONSE:', text);

  // cuba parse JSON
  let data;
  try {
    data = JSON.parse(text);
  } catch (err) {
    msg.textContent = 'Server bagi response bukan JSON. Tengok Console (RESPONSE).';
    return;
  }

  msg.textContent = data.success
    ? (data.message || 'Berjaya.')
    : (data.error || 'Gagal.');

} catch (e) {
  console.log('FETCH ERROR:', e);
  msg.textContent = 'Ralat: gagal hubungi server.';
}

    btn.disabled = false;
    btn.textContent = 'Hantar';
  });
</script>

</body>


</html>
