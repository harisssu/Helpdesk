<html>
    <head>
        <title>E-ICT Aduan</title>

        <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

        <style>
             body {
                font-family:Arial, Helvetica, sans-serif;
                margin: 0;
                height: 100vh;
                background-image: url("it6.jpg");
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                color: rgb(0, 0, 0); 
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .container {
                width: 600px;
                background: rgb(240, 237, 237);
                padding: 2rem;
                border-radius: 10px;
                box-shadow: 0 8px 20px rgba(154, 76, 76, 0.1);
            }

            .title {
                text-align: center;
                font-size: 2.2rem;
                font-weight: bold;
                margin-bottom: 1.5rem;
                color: #000000;
            }

            label {
                width: 150px;
                margin-right: 10px;
                font-weight: 500;
                color: #000000;
            }

            input {
                flex: 1;      
                padding: 0.2rem;
                border: 0.8px solid #1d0e0e;
                font-size: 0.9rem;
                width: 500px;
            }

            .form-group {
                display: flex;
                align-items: center;
                margin-bottom: 1rem;
            }

            .btn {
                width: 50%;
                background: #081c4b;
                border-radius: 0px;
                font-weight: bold;
                color: white;
                cursor: pointer;
                display: block;
                margin-top: 1rem;
                border: 0.8px solid #1d0e0e;
                font-size: 0.8rem;
            }

            .button-group {
                display: flex;
                gap: 40px;
            }

            .password-wrapper {
                position: relative;
                width: 70%;
            }

            .password-wrapper input {
                width: 105%;
                padding-right: 30px;
            }

            .toggle-password {
                position: absolute;
                top: 50%;
                right: 5px;
                transform: translateY(-50%);
                cursor: pointer;
                color: #555;
                font-size: 1rem;
                user-select: none;
            }

        </style>
    </head>
    <body>

            </div>

                    <option value="9">Farmasi DICE</option>
                    <option value="10">Farmasi Klinik Pakar</option>
                    <option value="11">Farmasi Logistik</option>
                    <option value="12">Farmasi Pengeluaran</option>
                    <option value="13">Farmasi Wad</option>
                    <option value="14">Forensik</option>
                    <option value="15">Hemodialisis</option>
                    <option value="16">ICU</option>
                    <option value="17">Jabatan Dietetik dan Sajian</option>
                    <option value="18">Jabatan Pergigian Pediatrik</option>
                    <option value="19">Kawalan Infeksi</option>
                    <option value="20">Kecemasan</option>
                    <option value="21">Klinik Pakar Obstetrik</option>
                    <option value="22">Klinik Pakar Ortopedik</option>
                    <option value="23">Klinik Pakar Pediatrik</option>
                    <option value="24">Klinik Pakar Psikiatri</option>
                    <option value="25">Methadone</option>
                    <option value="26">MOPD</option>
                    <option value="27">Oftalmologi</option>
                    <option value="28">Pejabat Pengarah</option>
                    <option value="29">Penyeliaan Kejururawatan</option>
                    <option value="30">Perpustakaan</option>
                    <option value="31">Porter</option>
                    <option value="32">SCN/NICU</option>
                    <option value="33">SOPD</option>
                    <option value="34">Unit Fisioterapi</option>
                    <option value="35">Unit Hal Ehwal Islam</option>
                    <option value="36">Unit IT</option>
                    <option value="37">Unit Kejuruteraan</option>
                    <option value="38">Unit Kerja Sosial</option>
                    <option value="39">Unit Keselamatan</option>
                    <option value="40">Unit Keselamatan dan Kesihatan</option>
                    <option value="41">Unit Kewangan dan Hasil</option>

                </select>
            </div>

            <div class="form-group">
                <label for ="noIC">Nombor IC: </label>
                <input type="text" id="noIC" required />
            </div>

            <div class="form-group">
                <label for ="noOffice">No Ofiice: </label>
                <input type="text" id="noOffice" required />
            </div>

            <div class="form-group">
                <label for ="emel">Emel: </label>
                <input type="email" id="emel" required />
            </div>

            <div class="form-group">
                <label for="kataLaluan">Kata Laluan: </label>
                <div class="password-wrapper">
                    <input type="password" id="kataLaluan" minlength="8" required />
                    <i class="fa-solid fa-eye toggle-password" onclick="togglePassword()"></i>
                </div>
            </div>

            <div class="form-group">
                <label for ="kataLaluan">Sahkan Kata Laluan: </label>
                <input type="password" id="sahkataLaluan" required />
            </div>

            <div class="form-group">
                <label>Adakah Anda Ketua Unit?</label>
                <input type="radio" name="isAdmin" value="yes" required> Ya
                <input type="radio" name="isAdmin" value="no"> Tidak
            </div>

            <div class="button-group">
                <a href="login.html" class="btn" style="text-align:center; text-decoration:none; line-height:2;">
                    Kembali
                </a>
                <button type="submit" class="btn">Daftar</button>
                <button type="reset" class="btn">Reset</button>
            </div>
            </form>
        </div>

        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

        <script>
        $(document).ready(function () {
            $('#jabatan').select2({
                placeholder: "-- Pilih --",
                allowClear: true
            });
        });

        document.getElementById('registrationForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const kataLaluan = document.getElementById('kataLaluan').value;
            const sahkataLaluan = document.getElementById('sahkataLaluan').value;

            if (kataLaluan.length < 8) {
                alert('Kata laluan mesti sekurang-kurangnya 8 aksara');
                return;
            }

            if (kataLaluan !== sahkataLaluan) {
                alert('Kata laluan dan Sahkan Kata Laluan tidak sama');
                return;
            }

            const isAdmin = document.querySelector('input[name="isAdmin"]:checked').value;

            const user = {
                noIC: document.getElementById('noIC').value,
                namaUser: document.getElementById('namaUser').value,
                jawatan: document.getElementById('jawatan').value,
                jabatan: document.getElementById('jabatan').value,
                noOffice: document.getElementById('noOffice').value,
                emel: document.getElementById('emel').value,
                kataLaluan: document.getElementById('kataLaluan').value,
                isAdmin: isAdmin
            };

            try {
                const response = await fetch('daftar1.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(user)
                });

                const result = await response.json();

                if (result.success) {
                    alert(result.message || 'Akaun berjaya didaftar');
                    window.location.href = "login.html";
                } else {
                    alert('Error: ' + (result.error || 'Gagal daftar akaun.'));
                }
            } catch (error) {
                alert('Gagal daftar akaun.');
                console.error(error);
            }
            });

            function togglePassword() {
                const passInput = document.getElementById("kataLaluan");
                const icon = document.querySelector(".toggle-password");

                if (passInput.type === "password") {
                    passInput.type = "text";
                    icon.classList.remove("fa-eye");
                    icon.classList.add("fa-eye-slash");
                } else {
                    passInput.type = "password";
                    icon.classList.remove("fa-eye-slash");
                    icon.classList.add("fa-eye");
                }
            }
        </script>
    </body>
</html>
